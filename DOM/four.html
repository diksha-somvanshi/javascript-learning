<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM | four</title>

</head>

<body style="background-color: black; color: aliceblue;">
<ul class="lang">
    <li>javascript</li>

</ul>
</body>
<script>
    function addLang(langName){
        const li = document.createElement('li');
        li.innerHTML = `${langName}`;
        document.querySelector('.lang').appendChild(li);
    }
    addLang("python");
    addLang("java");
    addLang("typeScript");

    function addOptiLang(langName){
        const li = document.createElement('li');
        li.appendChild(document.createTextNode(langName));
        document.querySelector('.lang').appendChild(li);
    }
      
    addOptiLang("c"); 
    addOptiLang("c++"); 
    // edit
    const secLang = document.querySelector('li:nth-child(2)');
    //secLang.innerHTML = "R lang";
    const newLi = document.createElement('li');
    newLi.textContent = "C#";
    secLang.replaceWith(newLi);

    //edit
    const firstLang = document.querySelector('li:first-child');
    firstLang.outerHTML = '<li>TypeScript<li/>'
    
    const lastLang = document.querySelector('li:last-child');
    lastLang.remove();

    document.querySelector('li:nth-child(2)').remove();

    document.querySelector('li:last-child').remove();

    document.querySelector('li:last-child').remove();
    

    


</script>

</html>
